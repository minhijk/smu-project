{% extends "main/base.html" %}

{% block title %}공지사항 작성{% endblock %}

{% block content %}
<h2>📢 공지사항 등록</h2>

<form id="noticeForm" style="margin-top: 20px;">
  <input type="text" id="title" placeholder="제목" style="width: 100%; padding: 10px;"><br><br>

  <select id="category" style="width: 100%; padding: 10px;">
    <option value="seoul">서울</option>
    <option value="cheonan">천안</option>
    <option value="employment">채용</option>
  </select><br><br>

  <textarea id="content" placeholder="내용" rows="10" style="width: 100%; padding: 10px;"></textarea><br><br>

  <button type="submit" style="padding: 10px 20px; background: #0d47a1; color: white; border: none;">등록</button>
</form>

<script>
document.getElementById("noticeForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  const category = document.getElementById("category").value;

  const response = await fetchWithAuth("/api/notice/create/", {
    method: "POST",
    body: JSON.stringify({ title, content, category })
  });

  const decoded = getDecodedJWT();
if (!decoded || decoded.role !== "admin") {
  alert("접근 권한이 없습니다.");
  window.location.href = "/";
}

  const result = await response.json();
  if (response.status === 201) {
    alert("공지 등록 완료!");
    window.location.href = `/notice?id=${result.id}`;
  } else {
    alert("등록 실패: " + (result.error || "알 수 없는 오류"));
  }
});

</script>
{% endblock %}
