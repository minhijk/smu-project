{% extends "main/base.html" %}

{% block title %}{{ notice.title }}{% endblock %}

{% block content %}
<h1>{{ notice.title }}</h1>
<div class="meta">
    <h3>작성자: {{ notice.author }} 작성일: {{ notice.created_at|date:"Y-m-d" }}</h3>
</div>
<p>{{ notice.content|linebreaks }}</p>
<br>
<a href="/noticelist" style="color: #0d47a1; text-decoration: none;">목록으로 돌아가기</a>

<div id="subMenu" class="sub-menu">
    <button class="close-btn" onclick="closeSubMenu()">X</button>
    <h2 id="subMenuTitle"></h2>
    <div id="subMenuContent"></div>
</div>

<script>
function getUrlParameter(name) {
    name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
    var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
    var results = regex.exec(location.search);
    return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
}

function openSubMenu(key) {
    const subMenu = document.getElementById('subMenu');
    const title = document.getElementById('subMenuTitle');
    const content = document.getElementById('subMenuContent');

    const data = {
        'academic': { title: '학사안내', content: '학사 일정', link: '/academic/calendar'},
        'life': { title: '대학생활', content: '통합 공지', link: '/noticelist'},
        'search': { 
            title: '', 
            content: `
                <input type='text' id='subMenuSearchInput' placeholder='검색'>
                <div style='margin-top:20px; display:flex; flex-wrap:wrap; gap:10px;'>
                    <button class="tag-btn">취업</button>
                    <button class="tag-btn">장학</button>
                    <button class="tag-btn">창업</button>
                    <button class="tag-btn">수강</button>
                    <button class="tag-btn">성적</button>
                    <button class="tag-btn">상생</button>
                    <button class="tag-btn">학사운영</button>
                    <button class="tag-btn">행사</button>
                    <button class="tag-btn">국제</button>
                    <button class="tag-btn">교양</button>
                    <button class="tag-btn">교환학생</button>
                    <button class="tag-btn">근로</button>
                    <button class="tag-btn">ecampus</button>
                    <button class="tag-btn">계절수업</button>
                    <button class="tag-btn">비교과</button>
                    <button class="tag-btn">상담</button>
                </div>
            `
        },
        'favorites': {
            title: '자주 사용하는 메뉴',
            content: `
                <div style='display:flex; flex-direction:column; align-items:center; gap:30px;'>
                    <div style='text-align:center;'>
                        <div style='font-size:2em;'>🖱️</div>
                        <div>수강신청</div>
                    </div>
                    <div style='text-align:center;'>
                        <div style='font-size:2em;'>📑</div>
                        <div>통합정보시스템</div>
                    </div>
                    <div style='text-align:center;'>
                        <div style='font-size:2em;'>💻</div>
                        <div>샘물포털</div>
                    </div>
                    <div style='text-align:center;'>
                        <div style='font-size:2em;'>🎓</div>
                        <div>e-campus</div>
                    </div>
                    <div style='text-align:center;'>
                        <div style='font-size:2em;'>🏢</div>
                        <div>office365</div>
                    </div>
                    <div style='text-align:center;'>
                        <div style='font-size:2em;'>📝</div>
                        <div>e-포트폴리오</div>
                    </div>
                    
                    <div style='margin-top:40px; display:flex; flex-direction:column; gap:20px;'>
                        <a href="https://www.instagram.com/sangmyung_univ" target="_blank" style="text-decoration:none; color:inherit; text-align:center;">
                            <div style='text-align:center;'>
                                <div style='font-size:2em;'>📸</div>
                                <div>인스타그램</div>
                            </div>
                        </a>
                        <a href="https://www.youtube.com/c/sangmyunguniversity" target="_blank" style="text-decoration:none; color:inherit; text-align:center;">
                            <div style='text-align:center;'>
                                <div style='font-size:2em;'>▶️</div>
                                <div>유튜브</div>
                            </div>
                        </a>
                    </div>
                </div>
            `
        }
    };

    const item = data[key];

    title.innerText = (key === 'search') ? '' : (item?.title || '메뉴');

    if (item?.link) {
        window.location.href = item.link;
        closeSubMenu();
    } else {
        content.innerHTML = item?.content || '선택된 메뉴에 대한 설명이 없습니다.';
    }

    subMenu.classList.add('active');

    if (key === 'search') {
        setTimeout(() => {
            document.querySelectorAll('#subMenuContent .tag-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    const tag = encodeURIComponent(this.textContent.trim());
                    window.location.href = `/noticelist?search=${tag}`; 
                });
            });

            const input = document.getElementById('subMenuSearchInput');
            if (input) {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const query = encodeURIComponent(this.value.trim());
                        if (query) {
                            window.location.href = `/noticelist?search=${query}`;
                        }
                    }
                });
            }
        }, 0);
    }
}

function closeSubMenu() {
    const subMenu = document.getElementById('subMenu');
    if (subMenu) {
        subMenu.classList.remove('active');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const subMenu = document.getElementById('subMenu');
    const sidebar = document.querySelector('.sidebar'); 

    document.addEventListener('click', function(event) {
        if (subMenu && subMenu.classList.contains('active')) {
            const isClickInsideSubMenu = subMenu.contains(event.target);
            const isClickInsideSidebar = sidebar && sidebar.contains(event.target);

            if (!isClickInsideSubMenu && !isClickInsideSidebar) {
                closeSubMenu();
            }
        }
    });

    const loginMenu = document.querySelector('.menu-item[data-key="login"]');

    if (loginMenu) {
        if (window.isLoggedIn === "true") {
            loginMenu.textContent = 'LOGOUT';
            loginMenu.removeAttribute('onclick');
            loginMenu.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = '/logout';
            });
        } else {
            loginMenu.textContent = 'LOGIN';
            loginMenu.removeAttribute('onclick');
            loginMenu.addEventListener('click', (e) => {
                e.preventDefault();
                window.open(
                    '/login/',
                    'loginPopup',
                    'width=480,height=600,resizable=no,scrollbars=no'
                );
            });
        }
    }
});
</script>
{% endblock %}
